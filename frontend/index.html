<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental Clinic - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-wrapper {
            position: relative;
            width: 900px;
            height: 550px;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(255, 102, 0, 0.2);
            box-shadow: 0 15px 40px rgba(255, 102, 0, 0.15);
            display: flex;
            overflow: hidden;
        }

        .login-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff8533 0%, #cc4400 100%);
            clip-path: polygon(0 0, 65% 0, 30% 100%, 0% 100%);
            z-index: 0;
        }

        .left-panel {
            position: relative;
            z-index: 1;
            flex: 1;
            padding: 60px 40px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .left-panel p {
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            opacity: 0.95;
            max-width: 250px;
        }

        .right-panel {
            position: relative;
            z-index: 1;
            flex: 1.1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .right-content-wrapper {
            width: 100%;
            max-width: 320px;
        }

        .right-panel h2 {
            color: #1a1a1a;
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 40px 0;
            text-align: center;
        }

        .form-group {
            position: relative;
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            color: #444444;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #cccccc;
            padding: 8px 30px 8px 0;
            color: #111111;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-bottom-color: #ff6600;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        /* Fix for browser autofill yellow background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #111111 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .input-icon {
            position: absolute;
            right: 0;
            bottom: 10px;
            width: 16px;
            height: 16px;
            fill: #888888;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #ff8533 0%, #cc4400 100%);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s, transform 0.1s;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.2);
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666666;
        }

        .login-link a {
            color: #ff6600;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="left-panel">
        <h1>WELCOME<br>BACK!</h1>
        <p>Access the Sunrise Dental Clinic system to manage appointments, billing, and patient records securely.</p>
    </div>

    <div class="right-panel">
        <div class="right-content-wrapper">
            <h2>Login</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="login-link">
                Need technical support? <a href="#">Contact Admin</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.querySelector('.btn-submit');
        btn.innerHTML = 'Signing in...';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        ffetch('http://localhost:8080/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
})
.then(res => res.json().then(data => ({ ok: res.ok, data })))
.then(({ ok, data }) => {
    if (ok && data.status === 'success') {
        localStorage.setItem('role', data.role);
        localStorage.setItem('username', data.username);
        window.location.href = 'dashboard.html';
    } else {
        alert(data.message || 'Invalid username or password');
        btn.innerHTML = 'Sign In';
    }
})
.catch(err => {
    console.error('Connection Error:', err);
    alert('Cannot reach server. Is it running?');
    btn.innerHTML = 'Sign In';
});
    });
</script>
</body>
</html>
