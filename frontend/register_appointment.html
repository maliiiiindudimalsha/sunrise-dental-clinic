<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Appointment - Sunrise Dental</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <div class="brand">Sunrise Dental</div>
    <ul class="sidebar-menu">
        <li><a href="dashboard.html">Dashboard / Home</a></li>
        <li><a href="register_appointment.html" class="active">Register Appointment</a></li>
        <li><a href="manage_appointments.html">Search / Update</a></li>
        <li><a href="billing.html">Billing &amp; Receipt</a></li>
        <li><a href="manage_dentists_treatments.html">Manage Dentists</a></li>
        <li><a href="reports.html">Reports &amp; Analytics</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="help.html">Help / Instructions</a></li>
    </ul>
    <a href="index.html" class="logout-btn">Log Out</a>
</div>

<div class="main-content">
    <div class="header">
        <div>
            <h1>Register New Appointment</h1>
            <p>Enter patient and appointment details below.</p>
        </div>
    </div>

    <div class="card-box">
        <div id="msgBox" class="msg-box"></div>

        <form id="appointmentForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Patient Name</label>
                    <input type="text" id="patientName" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="contactNumber" required>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label>Dentist</label>
                    <select id="dentistId" required>
                        <option value="">Select dentist</option>
                        <option value="1">Dr. Silva - General Dentistry</option>
                        <option value="2">Dr. Perera - Orthodontics</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Treatment Type</label>
                    <select id="treatmentId" required>
                        <option value="">Select treatment</option>
                        <option value="1">Consultation - Rs. 1,000</option>
                        <option value="2">Tooth Filling - Rs. 3,500</option>
                        <option value="3">Root Canal - Rs. 12,000</option>
                        <option value="4">Teeth Cleaning - Rs. 2,500</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Appointment Date</label>
                    <input type="date" id="appointmentDate" required>
                </div>
                <div class="form-group">
                    <label>Appointment Time</label>
                    <input type="time" id="appointmentTime" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">Register Appointment</button>
        </form>
    </div>
</div>

<script>
    // NOTE: dentist/treatment dropdowns are hardcoded for now.
    // Once DentistController and TreatmentController exist, replace with:
    // fetch('http://localhost:8080/dentists') and fetch('http://localhost:8080/treatments')

    document.getElementById('appointmentForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const msgBox = document.getElementById('msgBox');

        const payload = {
            patientName: document.getElementById('patientName').value,
            address: document.getElementById('address').value,
            contactNumber: document.getElementById('contactNumber').value,
            dentistId: document.getElementById('dentistId').value,
            treatmentId: document.getElementById('treatmentId').value,
            appointmentDate: document.getElementById('appointmentDate').value,
            appointmentTime: document.getElementById('appointmentTime').value
        };

        // This endpoint doesn't exist yet - AppointmentController is next to build.
        fetch('http://localhost:8080/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json().then(data => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
            msgBox.className = ok ? 'msg-box success' : 'msg-box error';
            msgBox.textContent = ok
                ? `Appointment registered successfully. Appointment No: ${data.appointmentNo || ''}`
                : (data.message || 'Failed to register appointment.');
            if (ok) document.getElementById('appointmentForm').reset();
        })
        .catch(() => {
            msgBox.className = 'msg-box error';
            msgBox.textContent = 'Cannot reach server. Backend endpoint not built yet.';
        });
    });
</script>
</body>
</html>
