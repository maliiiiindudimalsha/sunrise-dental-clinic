<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Appointment - Sunrise Dental</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/auth.js"></script>
</head>

<body>

<div class="sidebar">
    <div class="brand">Sunrise Dental</div>

    <ul class="sidebar-menu">
        <li><a href="dashboard.html">Dashboard / Home</a></li>
        <li><a href="register_appointment.html" class="active">Register Appointment</a></li>
        <li><a href="manage_appointments.html">Search / Update</a></li>
        <li><a href="billing.html">Billing &amp; Receipt</a></li>
        <li><a href="manage_dentists_treatments.html">Manage Dentists</a></li>
        <li><a href="reports.html">Reports &amp; Analytics</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="help.html">Help / Instructions</a></li>
    </ul>

    <a href="#" class="logout-btn" onclick="logout()">Log Out</a>
</div>


<div class="main-content">

    <div class="header">
        <div>
            <h1>Register New Appointment</h1>
            <p>Enter patient and appointment details below.</p>
        </div>
    </div>


    <div class="card-box">

        <div id="msgBox" class="msg-box"></div>

        <form id="appointmentForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Patient Name</label>
                    <input type="text" id="patientName" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="contactNumber" maxlength="20" required>
                </div>

                <div class="form-group" style="grid-column:1 / -1;">
                    <label>Address</label>
                    <input type="text" id="address" maxlength="255" required>
                </div>

                <div class="form-group">
                    <label>Dentist</label>
                    <select id="dentistId" required>
                        <option value="">Loading dentists...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Treatment Type</label>
                    <select id="treatmentId" required>
                        <option value="">Loading treatments...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Appointment Date</label>
                    <input type="date" id="appointmentDate" required>
                </div>

                <div class="form-group">
                    <label>Appointment Time</label>
                    <input type="time" id="appointmentTime" required>
                </div>

            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                Register Appointment
            </button>

        </form>

    </div>
</div>


<script>
    const API = 'http://localhost:8080';

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('appointmentDate').min =
            new Date().toISOString().split('T')[0];

        loadDentists();
        loadTreatments();
    });


    async function loadDentists() {
        const select = document.getElementById('dentistId');

        try {
            const res = await authFetch(`${API}/dentists`);
            const dentists = await res.json();

            select.innerHTML = '<option value="">Select dentist</option>';

            dentists.forEach(d => {
                select.innerHTML += `
                    <option value="${d.dentistId}">
                        ${escapeHtml(d.name)}${d.specialization ? ' - ' + escapeHtml(d.specialization) : ''}
                    </option>
                `;
            });

        } catch (e) {
            select.innerHTML = '<option value="">Unable to load dentists</option>';
        }
    }


    async function loadTreatments() {
        const select = document.getElementById('treatmentId');

        try {
            const res = await authFetch(`${API}/treatments`);
            const treatments = await res.json();

            select.innerHTML = '<option value="">Select treatment</option>';

            treatments.forEach(t => {
                select.innerHTML += `
                    <option value="${t.treatmentId}">
                        ${escapeHtml(t.treatmentName)} - Rs. ${Number(t.consultationFee).toLocaleString()}
                    </option>
                `;
            });

        } catch (e) {
            select.innerHTML = '<option value="">Unable to load treatments</option>';
        }
    }


    document.getElementById('appointmentForm').addEventListener('submit', async e => {
        e.preventDefault();

        const msg = document.getElementById('msgBox');
        const btn = document.getElementById('submitBtn');

        const payload = {
            patientName: document.getElementById('patientName').value.trim(),
            contactNumber: document.getElementById('contactNumber').value.trim(),
            address: document.getElementById('address').value.trim(),
            dentistId: document.getElementById('dentistId').value,
            treatmentId: document.getElementById('treatmentId').value,
            appointmentDate: document.getElementById('appointmentDate').value,
            appointmentTime: document.getElementById('appointmentTime').value
        };

        if (!/^[A-Za-z ]{2,100}$/.test(payload.patientName)) {
            return showError('Please enter a valid patient name.');
        }

        if (!/^[0-9+\- ]{7,20}$/.test(payload.contactNumber)) {
            return showError('Please enter a valid contact number.');
        }

        if (!payload.address || !payload.dentistId || !payload.treatmentId ||
            !payload.appointmentDate || !payload.appointmentTime) {
            return showError('Please complete all fields.');
        }

        if (payload.appointmentDate < new Date().toISOString().split('T')[0]) {
            return showError('Past dates are not allowed.');
        }

        btn.disabled = true;
        btn.textContent = 'Registering...';

        try {
            const res = await authFetch(`${API}/appointments`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.message || 'Failed to register appointment.');
                return;
            }

            msg.className = 'msg-box success';
            msg.textContent =
                `Appointment registered successfully. Appointment No: ${data.appointmentNo}`;

            document.getElementById('appointmentForm').reset();

            document.getElementById('appointmentDate').min =
                new Date().toISOString().split('T')[0];

        } catch (e) {
            showError('Cannot connect to the server.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Register Appointment';
        }
    });


    function showError(message) {
        const msg = document.getElementById('msgBox');
        msg.className = 'msg-box error';
        msg.textContent = message;
    }


    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
    }
</script>

</body>
</html>
